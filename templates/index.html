{% extends "base.html" %}

{% block extra_css %}
<style>
    .hero {
        background: linear-gradient(135deg, #faf9f7 0%, #f5f1ed 100%);
        padding: 60px 16px;
        text-align: center;
    }

    .hero-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
        max-width: 700px;
        margin: 0 auto;
    }

    .hero-logo {
        width: 100%;
        max-width: 300px;
        height: auto;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.08));
    }

    .hero h2 {
        font-family: 'Playfair Display', serif;
        font-size: 2.5rem;
        font-weight: 900;
        color: #6B4C7A;
        letter-spacing: -1px;
        line-height: 1.1;
        margin: 0;
    }

    .hero p {
        font-family: 'Lora', serif;
        font-size: 1.2rem;
        color: #6b7280;
        line-height: 1.6;
        margin: 0;
    }

    .cta-button {
        background: linear-gradient(135deg, #C41E3A 0%, #A01728 100%);
        color: white;
        padding: 16px 40px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-family: 'Lora', serif;
        font-size: 1.1rem;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(196, 30, 58, 0.3);
        display: inline-block;
        border: none;
        cursor: pointer;
    }

    .cta-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(196, 30, 58, 0.4);
    }

    @media (min-width: 768px) {
        .hero {
            padding: 100px 16px;
        }

        .hero-logo {
            max-width: 400px;
        }

        .hero h2 {
            font-size: 3.5rem;
        }

        .hero p {
            font-size: 1.4rem;
        }
    }
</style>
{% endblock %}

{% block content %}
    <section id="home" class="hero">
        <div class="hero-content">
            <img src="{{ url_for('static', filename='images/logo/logo.jpg') }}" alt="Ogni Passaggio Conta" class="hero-logo">
            <h2>Magliette che Hanno Storie</h2>
            <a href="/sports" class="cta-button">Vedi le Maglie</a>
        </div>
    </section>

    <section id="contact" class="contact">
        <div class="container">
