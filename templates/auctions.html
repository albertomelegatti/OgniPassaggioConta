{% extends "base.html" %}

{% block title %}Aste {{ sport|title }} - Ogni Passaggio Conta{% endblock %}

{% block content %}
    <section class="auctions-hero">
        <div class="container">
            <h1>Aste - {{ sport|title }}</h1>
        </div>
    </section>

    <section class="auctions-section">
        <div class="container">
            <div class="back-button">
                <a href="{{ url_for('sports') }}">← Torna agli sport</a>
            </div>

            <div class="auctions-grid">
                <!-- Le aste verranno popolate dal backend con query -->
            </div>
        </div>
    </section>

{% endblock %}

{% block extra_css %}
<style>
.auctions-hero {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 60px 20px;
    text-align: center;
    margin-bottom: 40px;
}

.auctions-hero h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
}

.auctions-hero p {
    font-size: 1.1rem;
    opacity: 0.95;
}

.back-button {
    margin-bottom: 30px;
}

.back-button a {
    display: inline-block;
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
    padding: 10px 20px;
    border: 2px solid #667eea;
    border-radius: 5px;
    transition: all 0.3s ease;
}

.back-button a:hover {
    background-color: #667eea;
    color: white;
}

.auctions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 30px;
    margin-bottom: 40px;
}

.auction-card {
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.auction-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
}

.auction-image {
    position: relative;
    width: 100%;
    padding-bottom: 100%;
    overflow: hidden;
    background: #f0f0f0;
}

.auction-image img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.auction-status {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #4CAF50;
    color: white;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
}

.auction-status.closed {
    background: #f44336;
}

.auction-details {
    padding: 20px;
}

.auction-details h3 {
    margin: 0 0 10px 0;
    font-size: 1.1rem;
    color: #333;
    min-height: 2.2em;
}

.auction-desc {
    color: #666;
    font-size: 0.95rem;
    margin-bottom: 15px;
    line-height: 1.4;
}

.auction-meta {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 15px;
    padding-bottom: 15px;
    border-bottom: 1px solid #eee;
}

.auction-meta span {
    display: block;
    font-size: 0.9rem;
    color: #555;
}

.auction-meta strong {
    color: #333;
    font-weight: 600;
}

.btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 5px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
}

.btn-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
}

.auctions-section {
    padding: 40px 20px;
    background: #f9f9f9;
    min-height: 60vh;
}

@media (max-width: 768px) {
    .auctions-hero h1 {
        font-size: 2rem;
    }

    .auctions-grid {
        grid-template-columns: 1fr;
        gap: 20px;
    }
}
</style>
{% endblock %}
